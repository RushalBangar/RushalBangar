        <tspan fill="#BE123C">const</tspan> <tspan fill="#0284C7">engineer</tspan> <tspan fill="#64748B">=</tspan> <tspan fill="#0F172A">{</tspan>
      </text>

      <text x="20" y="26" fill="#334155">
        <tspan fill="#64748B">name:</tspan> <tspan fill="#0D9488">"Rushal Bangar"</tspan><tspan fill="#64748B">,</tspan>
      </text>

      <text x="20" y="52" fill="#334155">
        <tspan fill="#64748B">ambassador:</tspan> <tspan fill="#0D9488">"Google Student Ambassador"</tspan><tspan fill="#64748B">,</tspan>
