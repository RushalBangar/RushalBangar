      </text>

      <text x="20" y="104" fill="#334155">
        <tspan fill="#64748B">coreFocus:</tspan> <tspan fill="#64748B">[</tspan><tspan fill="#7C3AED">"Multimodal AI"</tspan><tspan fill="#64748B">, </tspan><tspan fill="#7C3AED">"Full-Stack Web"</tspan><tspan fill="#64748B">],</tspan>
      </text>

      <text x="20" y="130" fill="#334155">
        <tspan fill="#64748B">flagshipWork:</tspan> <tspan fill="#64748B">[</tspan><tspan fill="#0284C7">"VivaVox"</tspan><tspan fill="#64748B">, </tspan><tspan fill="#0284C7">"Grahak-Kavach"</tspan><tspan fill="#64748B">, </tspan><tspan fill="#0284C7">"Smart-Bharat"</tspan><tspan fill="#64748B">],</tspan>
      </text>

      <text x="20" y="156" fill="#334155">
        <tspan fill="#64748B">shipping:</tspan> <tspan fill="#D97706">true</tspan><tspan fill="#64748B">,</tspan>
      </text>

      <text x="20" y="182" fill="#334155">
        <tspan fill="#64748B">collaborate:</tspan> <tspan fill="#BE123C">()</tspan> <tspan fill="#BE123C">=&gt;</tspan> <tspan fill="#0D9488">"Always open for impact!"</tspan>
      </text>

      <text x="0" y="208" fill="#0F172A">};</text>
