<svg width="780" height="240" viewBox="0 0 780 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="780" height="240" rx="20" fill="#070A14" stroke="#1E293B" stroke-width="1.5"/>
  <text x="36" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#38BDF8" letter-spacing="0.05em">PRIMARY CODEBASE DISTRIBUTION</text>

  <!-- Overall Bar -->
  <g transform="translate(36, 60)">
    <rect x="0" y="0" width="708" height="14" rx="7" fill="#1E293B"/>
    <!-- JavaScript: ~34% -> 240px -->
    <rect x="0" y="0" width="240" height="14" rx="7" fill="#F7DF1E"/>
    <!-- TypeScript: ~28% -> 198px -->
    <rect x="242" y="0" width="198" height="14" rx="0" fill="#3178C6"/>
    <!-- HTML/CSS: ~25% -> 177px -->
    <rect x="442" y="0" width="177" height="14" rx="0" fill="#E34F26"/>
    <!-- Python: ~13% -> 89px -->
    <rect x="621" y="0" width="87" height="14" rx="7" fill="#3776AB"/>
  </g>

  <!-- Legend Items -->
  <g transform="translate(36, 102)">
    <!-- JavaScript -->
    <circle cx="8" cy="14" r="6" fill="#F7DF1E"/>
    <text x="24" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#F1F5F9">JavaScript</text>
    <text x="24" y="36" font-family="Consolas, monospace" font-size="12" fill="#94A3B8">8 Core Repos (34%)</text>

    <!-- TypeScript -->
    <circle cx="190" cy="14" r="6" fill="#3178C6"/>
    <text x="206" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#F1F5F9">TypeScript</text>
    <text x="206" y="36" font-family="Consolas, monospace" font-size="12" fill="#94A3B8">6 Core Repos (28%)</text>

    <!-- HTML / CSS -->
    <circle cx="370" cy="14" r="6" fill="#E34F26"/>
    <text x="386" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#F1F5F9">HTML5 &amp; CSS3</text>
    <text x="386" y="36" font-family="Consolas, monospace" font-size="12" fill="#94A3B8">9 Responsive Apps (25%)</text>

    <!-- Python -->
    <circle cx="560" cy="14" r="6" fill="#3776AB"/>
    <text x="576" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#F1F5F9">Python &amp; AI</text>
