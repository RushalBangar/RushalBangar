<svg width="1280" height="420" viewBox="0 0 1280 420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1280" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#070A14"/>
      <stop offset="50%" stop-color="#0C1322"/>
      <stop offset="100%" stop-color="#080D1A"/>
    </linearGradient>

    <!-- Mesh Glows -->
    <radialGradient id="glowTopLeft" cx="150" cy="80" r="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4F46E5" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#4F46E5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowBottomRight" cx="1100" cy="340" r="420" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0"/>
    </radialGradient>

    <!-- Text Gradients -->
    <linearGradient id="nameGrad" x1="0" y1="0" x2="480" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="300" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>

    <!-- Card Background -->
    <linearGradient id="cardBg" x1="0" y1="0" x2="520" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#111827" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0B0F19" stop-opacity="0.92"/>
    </linearGradient>

    <!-- Dot Grid Pattern -->
    <pattern id="dotGrid" x="0" y="0" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#334155" fill-opacity="0.3"/>
    </pattern>
  </defs>

  <!-- Outer Canvas with Border -->
  <rect width="1280" height="420" rx="24" fill="url(#bgGrad)"/>
  <rect width="1280" height="420" rx="24" fill="url(#dotGrid)"/>
  <rect width="1280" height="420" fill="url(#glowTopLeft)"/>
  <rect width="1280" height="420" fill="url(#glowBottomRight)"/>
  <rect x="1" y="1" width="1278" height="418" rx="23" stroke="#1E293B" stroke-width="1.5"/>

  <!-- Left Content Column -->
  <g transform="translate(64, 48)">
    <!-- Status Badge -->
    <rect x="0" y="0" width="310" height="32" rx="16" fill="#064E3B" fill-opacity="0.5" stroke="#059669" stroke-width="1"/>
    <circle cx="16" cy="16" r="4.5" fill="#10B981"/>
    <text x="28" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#6EE7B7" letter-spacing="0.06em">GOOGLE STUDENT AMBASSADOR</text>

    <!-- Headline Name -->
    <text x="0" y="88" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="46" font-weight="800" fill="url(#nameGrad)" letter-spacing="-0.03em">Rushal Bangar</text>

    <!-- Professional Roles -->
    <text x="0" y="126" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#E2E8F0">
      AI Engineer <tspan fill="#38BDF8">•</tspan> Full-Stack Developer <tspan fill="#38BDF8">•</tspan> AI &amp; DS Scholar
    </text>

    <!-- Value Statement -->
    <text x="0" y="162" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14.5" fill="#94A3B8">
      Designing &amp; shipping intelligent web platforms with multimodal AI, slick UI &amp; real-world impact.
    </text>
    <text x="0" y="186" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#64748B">
      B.Tech in Artificial Intelligence &amp; Data Science @ Matoshri College (MCOERC) • Nashik, India
    </text>

    <!-- Key Stats Counter Ribbon -->
    <g transform="translate(0, 222)">
      <rect x="0" y="0" width="136" height="54" rx="12" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
      <text x="16" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#38BDF8">26+</text>
      <text x="16" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="500" fill="#94A3B8">Repositories</text>

      <rect x="148" y="0" width="146" height="54" rx="12" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
      <text x="164" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#34D399">15+</text>
      <text x="164" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="500" fill="#94A3B8">Live Deployments</text>

      <rect x="306" y="0" width="170" height="54" rx="12" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
      <text x="322" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#A78BFA">GenAI &amp; Web</text>
      <text x="322" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="500" fill="#94A3B8">Production Systems</text>
    </g>

    <!-- Tech Stack Mini Badges -->
    <g transform="translate(0, 296)">
      <!-- Pill 1: Python -->
      <rect x="0" y="0" width="76" height="26" rx="13" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <text x="38" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#CBD5E1" text-anchor="middle">Python</text>

      <!-- Pill 2: TypeScript -->
      <rect x="84" y="0" width="96" height="26" rx="13" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <text x="132" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#CBD5E1" text-anchor="middle">TypeScript</text>

      <!-- Pill 3: React -->
      <rect x="188" y="0" width="72" height="26" rx="13" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <text x="224" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#38BDF8" text-anchor="middle">React.js</text>

      <!-- Pill 4: Gemini AI -->
      <rect x="268" y="0" width="94" height="26" rx="13" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <text x="315" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#A78BFA" text-anchor="middle">Gemini AI</text>

      <!-- Pill 5: Node.js -->
      <rect x="370" y="0" width="76" height="26" rx="13" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <text x="408" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#34D399" text-anchor="middle">Node.js</text>

      <!-- Pill 6: Firebase -->
      <rect x="454" y="0" width="82" height="26" rx="13" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <text x="495" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#FBBF24" text-anchor="middle">Firebase</text>
    </g>
