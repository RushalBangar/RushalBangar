  <!-- Right Side: Interactive Code Terminal Card -->
  <g transform="translate(710, 44)">
    <!-- Terminal Outer Frame -->
    <rect width="506" height="332" rx="18" fill="url(#cardBg)" stroke="#1F2937" stroke-width="1.5"/>

    <!-- Terminal Header Bar -->
    <path d="M0 18C0 8.05888 8.05888 0 18 0H488C497.941 0 506 8.05888 506 18V42H0V18Z" fill="#131B2E"/>
    <line x1="0" y1="42" x2="506" y2="42" stroke="#1F2937" stroke-width="1"/>

    <!-- Window Dots -->
    <circle cx="24" cy="21" r="5.5" fill="#EF4444"/>
    <circle cx="42" cy="21" r="5.5" fill="#F59E0B"/>
    <circle cx="59" cy="21" r="5.5" fill="#10B981"/>

    <!-- Window Title -->
    <text x="253" y="25" font-family="Consolas, 'Fira Code', 'Courier New', monospace" font-size="12" fill="#94A3B8" text-anchor="middle">engineer.ts</text>

    <!-- Code Content -->
    <g transform="translate(24, 68)" font-family="Consolas, 'Fira Code', 'Courier New', monospace" font-size="13.5" letter-spacing="0.02em">
      <text x="0" y="0" fill="#E2E8F0">
        <tspan fill="#F43F5E">const</tspan> <tspan fill="#38BDF8">engineer</tspan> <tspan fill="#94A3B8">=</tspan> <tspan fill="#E2E8F0">{</tspan>
      </text>

      <text x="20" y="26" fill="#CBD5E1">
        <tspan fill="#94A3B8">name:</tspan> <tspan fill="#34D399">"Rushal Bangar"</tspan><tspan fill="#94A3B8">,</tspan>
      </text>

      <text x="20" y="52" fill="#CBD5E1">
        <tspan fill="#94A3B8">ambassador:</tspan> <tspan fill="#34D399">"Google Student Ambassador"</tspan><tspan fill="#94A3B8">,</tspan>
      </text>

      <text x="20" y="78" fill="#CBD5E1">
        <tspan fill="#94A3B8">discipline:</tspan> <tspan fill="#34D399">"B.Tech in AI &amp; Data Science"</tspan><tspan fill="#94A3B8">,</tspan>
      </text>

      <text x="20" y="104" fill="#CBD5E1">
        <tspan fill="#94A3B8">coreFocus:</tspan> <tspan fill="#94A3B8">[</tspan><tspan fill="#A78BFA">"Multimodal AI"</tspan><tspan fill="#94A3B8">, </tspan><tspan fill="#A78BFA">"Full-Stack Web"</tspan><tspan fill="#94A3B8">],</tspan>
      </text>

      <text x="20" y="130" fill="#CBD5E1">
        <tspan fill="#94A3B8">flagshipWork:</tspan> <tspan fill="#94A3B8">[</tspan><tspan fill="#38BDF8">"VivaVox"</tspan><tspan fill="#94A3B8">, </tspan><tspan fill="#38BDF8">"Grahak-Kavach"</tspan><tspan fill="#94A3B8">, </tspan><tspan fill="#38BDF8">"Smart-Bharat"</tspan><tspan fill="#94A3B8">],</tspan>
      </text>

      <text x="20" y="156" fill="#CBD5E1">
        <tspan fill="#94A3B8">shipping:</tspan> <tspan fill="#FBBF24">true</tspan><tspan fill="#94A3B8">,</tspan>
      </text>

      <text x="20" y="182" fill="#CBD5E1">
        <tspan fill="#94A3B8">collaborate:</tspan> <tspan fill="#F43F5E">()</tspan> <tspan fill="#F43F5E">=&gt;</tspan> <tspan fill="#34D399">"Always open for impact!"</tspan>
      </text>

      <text x="0" y="208" fill="#E2E8F0">};</text>
    </g>

    <!-- Terminal Footer Badge -->
    <g transform="translate(24, 292)">
      <rect x="0" y="0" width="458" height="26" rx="8" fill="#131B2E" stroke="#1E293B" stroke-width="1"/>
      <text x="16" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#38BDF8">PORTFOLIO:</text>
      <text x="96" y="17" font-family="Consolas, monospace" font-size="11" fill="#94A3B8">https://rushalbangar.netlify.app</text>
      <text x="442" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#34D399" text-anchor="end">LIVE ●</text>
    </g>
  </g>
</svg>