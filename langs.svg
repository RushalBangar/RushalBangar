<svg width="780" height="360" viewBox="0 0 780 360" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="780" height="360" rx="36" fill="#020617"/>
  <text x="42" y="58" font-family="Inter" font-size="28" fill="#A7F3D0" opacity="0.95">Local Languages</text>
  <g transform="translate(42, 90)">
    <text x="0" y="0" font-family="Inter" font-size="18" fill="#E2E8F0">JavaScript</text>
    <rect x="0" y="16" width="680" height="18" rx="9" fill="#111827"/>
    <rect x="0" y="16" width="560" height="18" rx="9" fill="#22D3EE">
      <animate attributeName="width" from="0" to="560" dur="1s" fill="freeze"/>
    </rect>

    <text x="0" y="72" font-family="Inter" font-size="18" fill="#E2E8F0">HTML & CSS</text>
    <rect x="0" y="88" width="680" height="18" rx="9" fill="#111827"/>
    <rect x="0" y="88" width="610" height="18" rx="9" fill="#34D399">
      <animate attributeName="width" from="0" to="610" dur="1.1s" begin="0.15s" fill="freeze"/>
    </rect>

    <text x="0" y="144" font-family="Inter" font-size="18" fill="#E2E8F0">React</text>
    <rect x="0" y="160" width="680" height="18" rx="9" fill="#111827"/>
    <rect x="0" y="160" width="490" height="18" rx="9" fill="#A855F7">
      <animate attributeName="width" from="0" to="490" dur="1.2s" begin="0.3s" fill="freeze"/>
    </rect>

    <text x="0" y="216" font-family="Inter" font-size="18" fill="#E2E8F0">Python</text>
    <rect x="0" y="232" width="680" height="18" rx="9" fill="#111827"/>
    <rect x="0" y="232" width="360" height="18" rx="9" fill="#FBBF24">
      <animate attributeName="width" from="0" to="360" dur="1.3s" begin="0.45s" fill="freeze"/>
    </rect>
  </g>
</svg>