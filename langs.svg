  <g transform="translate(36, 178)">
    <rect width="708" height="34" rx="8" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
    <text x="16" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94A3B8">
      Integrated with <tspan fill="#60A5FA" font-weight="600">React.js</tspan>, <tspan fill="#34D399" font-weight="600">Node.js</tspan>, <tspan fill="#A78BFA" font-weight="600">Google Gemini API</tspan>, <tspan fill="#F59E0B" font-weight="600">Firebase</tspan>, and <tspan fill="#10B981" font-weight="600">MongoDB</tspan>.
    </text>
