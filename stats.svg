<svg width="780" height="360" viewBox="0 0 780 360" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="780" height="360" rx="36" fill="#020617"/>
  <text x="42" y="58" font-family="Inter" font-size="28" fill="#A7F3D0" opacity="0.95">Local Stats</text>
  <g transform="translate(42, 90)">
    <rect x="0" y="0" width="690" height="12" rx="6" fill="#111827"/>
    <rect x="0" y="0" width="520" height="12" rx="6" fill="#22D3EE">
      <animate attributeName="width" from="0" to="520" dur="1.2s" fill="freeze"/>
    </rect>
    <text x="0" y="-12" font-family="Inter" font-size="16" fill="#E2E8F0">Contributions</text>

    <rect x="0" y="60" width="690" height="12" rx="6" fill="#111827"/>
    <rect x="0" y="60" width="410" height="12" rx="6" fill="#34D399">
      <animate attributeName="width" from="0" to="410" dur="1.1s" begin="0.2s" fill="freeze"/>
    </rect>
    <text x="0" y="48" font-family="Inter" font-size="16" fill="#E2E8F0">Repos</text>

    <rect x="0" y="120" width="690" height="12" rx="6" fill="#111827"/>
    <rect x="0" y="120" width="600" height="12" rx="6" fill="#A855F7">
      <animate attributeName="width" from="0" to="600" dur="1.3s" begin="0.4s" fill="freeze"/>
    </rect>
    <text x="0" y="108" font-family="Inter" font-size="16" fill="#E2E8F0">Activity</text>

    <rect x="0" y="180" width="690" height="12" rx="6" fill="#111827"/>
    <rect x="0" y="180" width="470" height="12" rx="6" fill="#FBBF24">
      <animate attributeName="width" from="0" to="470" dur="1.2s" begin="0.6s" fill="freeze"/>
    </rect>
    <text x="0" y="168" font-family="Inter" font-size="16" fill="#E2E8F0">Learning</text>
  </g>
</svg>