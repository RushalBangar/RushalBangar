name: GitHub Snake

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: platane/snk@v0.1.4
        with:
          output: output/github-snake.svg
          branch: output
          width: 900
          height: 400
          colors: '00ff41,ffffff,070b16'
          background: '0f1727'
          no_reward: true
      - name: Commit updated snake
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/github-snake.svg
          git commit -m "Update GitHub snake" || echo "No changes to commit"
          git push origin output
